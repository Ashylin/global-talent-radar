services:
  - type: web
    name: global-talent-radar
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: radar-db
          property: connectionString
databases:
  - name: radar-db
    plan: free
    databaseName: global_talent_radar
    user: radar
    postgresMajorVersion: "17"
