name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: global_talent_radar
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: ci-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U radar -d global_talent_radar"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/global_talent_radar
      DATABASE_USERNAME: radar
      DATABASE_PASSWORD: ci-test-only
      RUN_DATABASE_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit && npm run build
        working-directory: frontend
      - run: chmod +x gradlew && ./gradlew --no-daemon test bootJar
      - uses: actions/upload-artifact@v4
        with:
          name: global-talent-radar
          path: build/libs/global-talent-radar.jar
